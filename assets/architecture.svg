<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">QR System backend architecture</title>
  <desc id="desc">Frontend clients communicate with a FastAPI API, which handles authentication, orders, reports, WebSockets, and SQLite persistence.</desc>
  <rect width="1200" height="560" fill="#0b1220"/>
  <text x="70" y="82" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">QR System Backend</text>
  <text x="70" y="116" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Portfolio architecture overview</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="205" width="225" height="148" rx="12" fill="#172554" stroke="#38bdf8" stroke-width="2"/>
    <text x="96" y="252" fill="#7dd3fc" font-size="16" font-weight="700">CLIENTS</text>
    <text x="96" y="287" fill="#f8fafc" font-size="21">Guest QR flow</text>
    <text x="96" y="320" fill="#cbd5e1" font-size="17">Kitchen · Reception · Manager</text>

    <rect x="455" y="155" width="290" height="250" rx="12" fill="#123047" stroke="#2dd4bf" stroke-width="2"/>
    <text x="483" y="205" fill="#5eead4" font-size="16" font-weight="700">APPLICATION LAYER</text>
    <text x="483" y="246" fill="#f8fafc" font-size="25" font-weight="700">FastAPI</text>
    <text x="483" y="286" fill="#cbd5e1" font-size="18">REST endpoints · WebSockets</text>
    <text x="483" y="320" fill="#cbd5e1" font-size="18">Role authorization · Reports</text>
    <text x="483" y="354" fill="#cbd5e1" font-size="18">Validation · Excel exports</text>

    <rect x="905" y="205" width="225" height="148" rx="12" fill="#2d214f" stroke="#a78bfa" stroke-width="2"/>
    <text x="932" y="252" fill="#c4b5fd" font-size="16" font-weight="700">PERSISTENCE</text>
    <text x="932" y="290" fill="#f8fafc" font-size="22">SQLAlchemy + SQLite</text>
    <text x="932" y="321" fill="#ddd6fe" font-size="17">Orders · Catalog · Staff</text>

    <path d="M310 279 H420" stroke="#38bdf8" stroke-width="4" fill="none"/>
